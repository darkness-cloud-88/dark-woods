<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>الغابة المظلمة</title>
<style>
:root{--bg:#070b08;--blood:#b3261e;--bone:#e8e0cf;--moss:#1c2e1d;--amber:#e0a93b}
html,body{margin:0;height:100%;background:var(--bg);color:var(--bone);font-family:"Noto Naskh Arabic","Amiri",Georgia,serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 30%,#14201a,var(--bg) 70%);text-align:center;padding:24px;z-index:5}
h1{margin:0;font-size:3rem;color:var(--blood);text-shadow:0 0 18px #5a0f0b}
p{margin:0;max-width:22em;line-height:1.7;color:#b9b3a3}
button,input{font:inherit;font-size:1.15rem;padding:12px 22px;border-radius:6px;border:1px solid #4a2a26;background:#1a0f0e;color:var(--bone)}
button{background:var(--blood);border-color:var(--blood);font-weight:700}
button.alt{background:var(--moss);border-color:#3b5a3c}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input{width:6em;text-align:center;letter-spacing:.2em;text-transform:uppercase}
.row{display:flex;gap:8px}
#menu{overflow:auto}
#rot{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:9;text-align:center;font-size:1.3rem;padding:24px}
#fb{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:28px;width:78px;height:78px;border-radius:50%;z-index:3;font-size:2rem;padding:0;background:rgba(179,38,30,.65)}
#mm{position:fixed;top:64px;left:10px;width:120px;height:120px;border:1px solid #4a2a26;z-index:3;pointer-events:none}
#zb{position:fixed;top:64px;left:138px;z-index:3;display:flex;flex-direction:column;gap:6px}
#zb button{padding:0;width:38px;height:38px;font-size:1.3rem;background:#1a0f0e;opacity:.85}
#c{z-index:1}
#mm{right:auto;bottom:auto}
#ic{z-index:8;display:none}
.pn{display:flex;flex-direction:column;align-items:center;gap:14px}
#rot b{font-size:3.2rem}
@media (orientation:portrait){#rot{display:flex}}
@media (orientation:landscape) and (max-height:520px){#menu{gap:8px;padding:10px 24px}h1{font-size:2rem}p{font-size:.95rem;line-height:1.4}button,input{padding:8px 18px}}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 0 6px #000;font-size:1.05rem;line-height:1.6;z-index:2}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="menu">
<div id="m1" class="pn"><h1>الغابة المظلمة</h1><p>اجمعوا ٥ مفاتيح 🔑 والتقطوا الأسلحة 🔫، ثم واجهوا الكيان معًا في معركة من ٣ مراحل. اسحب على <b>يسار</b> الشاشة للمشي، وعلى <b>يمينها</b> للنظر في كل الاتجاهات.</p>
<button onclick="goLandscape();soloGame()">لعب فردي</button>
<button onclick="goLandscape();hostGame()">إنشاء غرفة مع الأصدقاء</button>
<div class="row"><input id="ci" maxlength="4" placeholder="الكود" aria-label="كود الغرفة"><button class="alt" onclick="goLandscape();joinGame()">انضمام</button></div></div>
<div id="lb" class="pn" style="display:none"><h1>غرفة الانتظار</h1><p>كود الغرفة: <b id="lbc"></b><br>أرسله لأصدقائك ليكتبوه في «انضمام»</p><p id="lbn"></p>
<div id="lbh" class="pn"><p>عدد اللاعبين لبدء اللعبة:</p><div class="row"><button class="alt" onclick="want=2">٢</button><button class="alt" onclick="want=3">٣</button><button class="alt" onclick="want=4">٤</button></div><button onclick="startGame()">ابدأ الآن</button></div></div>
</div>
<canvas id="ic"></canvas>
<canvas id="mm" width="120" height="120"></canvas><div id="zb"><button onclick="mz=Math.min(4,mz*2)">+</button><button onclick="mz=Math.max(1,mz/2)">−</button></div><button id="fb" aria-label="إطلاق">🔫</button>
<div id="rot"><b>📱↻</b>أدر جوالك بالعرض للعب</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=id=>document.getElementById(id),cv=$('c'),g=cv.getContext('2d'),dk=document.createElement('canvas'),d=dk.getContext('2d');
const W=1600,KEYS=5,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647; // same seed = same forest for everyone
const gate={x:1520,y:1520},keys=[],trees=[];
for(let i=0;i<KEYS;i++)keys.push({x:250+rnd()*1100,y:250+rnd()*1100,got:false});
for(let i=0;i<120;i++){const x=rnd()*W,y=rnd()*W,r=16+rnd()*14;
  if(Math.hypot(x-120,y-120)>100&&Math.hypot(x-gate.x,y-gate.y)>100&&keys.every(k=>Math.hypot(x-k.x,y-k.y)>r+30))trees.push({x,y,r})}

let me='h',host=false,peer,conns=[],P={},M={x:1400,y:300},st='menu',room='',last=0,net=0,joy={x:0,y:0},kb={};
const addP=id=>P[id]={x:110+Math.random()*30,y:110+Math.random()*30,out:false,a:0,am:0};


// ---------- audio (synthesized, no files) ----------
let ac,mg;
function initAudio(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.8;mg.connect(ac.destination);
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=220;lp.connect(mg);
  [55,55.7,82.4].forEach(f=>{const o=ac.createOscillator(),v=ac.createGain();o.type='sawtooth';o.frequency.value=f;v.gain.value=.05;o.connect(v);v.connect(lp);o.start()});
  const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=.08;lg.gain.value=120;l.connect(lg);lg.connect(lp.frequency);l.start();
  setInterval(()=>tone(700+Math.random()*500,3,'sine',.03,380),9000)}
function tone(f,d,ty='sine',v=.3,f2){if(!ac)return;const T=ac.currentTime,o=ac.createOscillator(),n=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);n.gain.setValueAtTime(v,T);n.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(n);n.connect(mg);o.start();o.stop(T+d)}
function noise(d,v,f){if(!ac)return;const T=ac.currentTime,b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),n=ac.createGain();s.buffer=b;fl.type='lowpass';fl.frequency.value=f;n.gain.setValueAtTime(v,T);n.gain.exponentialRampToValueAtTime(.001,T+d);s.connect(fl);fl.connect(n);n.connect(mg);s.start()}
const step=()=>noise(.12,.25,600),thud=v=>{tone(60,.3,'sine',.6*v,30);noise(.15,.4*v,200)},beat=v=>{tone(55,.15,'sine',.7*v,35);setTimeout(()=>tone(50,.15,'sine',.5*v,32),160)},shot=()=>{noise(.2,.8,3000);tone(200,.15,'square',.2,50)};
function scare(){js=.7;noise(.9,1,6000);tone(900,.8,'sawtooth',.5,300);tone(1400,.8,'square',.3,500)}

// ---------- art ----------
const ts=document.createElement('canvas');ts.width=ts.height=64;
{const c=ts.getContext('2d');c.fillStyle='#1a1008';c.beginPath();c.arc(32,32,6,0,7);c.fill();
 for(let i=0;i<7;i++){const a=i*.9,x=32+Math.cos(a)*13,y=32+Math.sin(a)*13,r=c.createRadialGradient(x,y,2,x,y,17);r.addColorStop(0,'#1f3a1f');r.addColorStop(1,'rgba(8,20,8,0)');c.fillStyle=r;c.beginPath();c.arc(x,y,17,0,7);c.fill()}}
const gt=document.createElement('canvas');gt.width=gt.height=128;let gp;
{const c=gt.getContext('2d');c.fillStyle='#0c140c';c.fillRect(0,0,128,128);
 for(let i=0;i<260;i++){c.strokeStyle=`rgba(${20+Math.random()*30|0},${40+Math.random()*40|0},20,.5)`;const x=Math.random()*128,y=Math.random()*128;c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.random()*4-2,y-3-Math.random()*5);c.stroke()}
 for(let i=0;i<30;i++){c.fillStyle='rgba(40,30,20,.5)';c.fillRect(Math.random()*128,Math.random()*128,3,2)}
 gp=g.createPattern(gt,'repeat')}
function face(c,x,y,s,t){ // the monster: spiked head, flesh face, screaming mouth, dark hunched body
  c.save();c.translate(x,y);c.scale(s,s);c.strokeStyle='#4a2a2a';c.lineWidth=1.2;
  for(let i=0;i<14;i++){const a=i/14*6.28+.3,l=26+(i%3)*7;c.beginPath();c.moveTo(Math.cos(a)*14,Math.sin(a)*15-4);c.lineTo(Math.cos(a)*l,Math.sin(a)*l-4);c.stroke()}
  c.fillStyle='#0b0708';c.beginPath();c.ellipse(0,26,18,22,0,0,7);c.fill();
  const q=c.createRadialGradient(-4,-8,2,0,0,20);q.addColorStop(0,'#a33a33');q.addColorStop(1,'#4a1212');c.fillStyle=q;
  c.beginPath();c.moveTo(-14,-12);c.quadraticCurveTo(-4,-22,14,-14);c.quadraticCurveTo(18,0,10,12);c.quadraticCurveTo(0,20,-10,12);c.quadraticCurveTo(-18,0,-14,-12);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(-6,-6,3.4,0,7);c.arc(5,-7,3.4,0,7);c.fill();
  c.fillStyle='#000';c.beginPath();c.arc(-6,-6,1.4,0,7);c.arc(5,-7,1.4,0,7);c.fill();
  c.beginPath();c.ellipse(0,5,6,5+Math.sin(t*9)*1.5,0,0,7);c.fill();c.restore()}
function person(q,m){g.save();g.translate(q.x,q.y);g.rotate(q.a||0);g.fillStyle=q.out?'#3a2422':m?'#23415a':'#5a3a23';g.beginPath();g.ellipse(0,0,4,9,0,0,7);g.fill();g.fillStyle='#d8b898';g.beginPath();g.arc(1,0,4.2,0,7);g.fill();g.restore()}

// ---------- state: weapons, boss, effects ----------
let stun=0,crT=6,boss={on:false,hp:0,max:0,ph:1,dash:3,dl:0,bl:5},crates=[],js=0,cd=0,fcd=0,flash=0,stepT=0,mst=0,hb=0,wasOut=false,bs=false,fire=false,mz=1;
for(let i=0;i<5;i++)crates.push({x:150+Math.random()*1300,y:150+Math.random()*1300});
const fb=$('fb');fb.onpointerdown=()=>fire=true;fb.onpointerup=fb.onpointerleave=fb.onpointercancel=()=>fire=false;
function shoot(id,a){const q=P[id];if(!q||q.out||q.am<1)return;q.am--;
  const dx=M.x-q.x,dy=M.y-q.y,pr=dx*Math.cos(a)+dy*Math.sin(a),pe=Math.abs(-dx*Math.sin(a)+dy*Math.cos(a));
  if(pr>0&&pr<300&&pe<(boss.on?28:18)){if(boss.on)boss.hp-=8;else stun=1.2}}

// ---------- 3D (three.js): 2D world coords x,y map to ground x,z ----------
let walk=false,lk=0,pt=0,want=2,introT=0,it0=0,ie=[],skipI=false,um=true,uiS=false;
const U=.04,R=new THREE.WebGLRenderer({antialias:false});
R.domElement.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:0';document.body.prepend(R.domElement);
const scn=new THREE.Scene(),cam=new THREE.PerspectiveCamera(72,1,.1,60),fl3=new THREE.SpotLight(0xfff0d0,1.8,28,.5,.6,1);
scn.fog=new THREE.FogExp2(0x030503,.1);scn.background=new THREE.Color(0x030503);
cam.rotation.order='YXZ';scn.add(cam,new THREE.AmbientLight(0x1a2a1a,.6));cam.add(fl3,fl3.target);fl3.target.position.set(0,0,-1);
const gtex=new THREE.CanvasTexture(gt);gtex.wrapS=gtex.wrapT=THREE.RepeatWrapping;gtex.repeat.set(24,24);
const gm=new THREE.Mesh(new THREE.PlaneGeometry(W*U,W*U),new THREE.MeshStandardMaterial({map:gtex,roughness:1}));
gm.rotation.x=-Math.PI/2;gm.position.set(W*U/2,0,W*U/2);scn.add(gm);
{const tg=new THREE.CylinderGeometry(.18,.28,7,6),cg=new THREE.ConeGeometry(1.6,5,7),tm=new THREE.MeshStandardMaterial({color:0x2a1d12,roughness:1}),cmat=new THREE.MeshStandardMaterial({color:0x14301a,roughness:1});
 trees.forEach(r=>{const k=r.r/22,a=new THREE.Mesh(tg,tm),b=new THREE.Mesh(cg,cmat);a.position.set(r.x*U,3.5,r.y*U);a.scale.set(k,1,k);b.position.set(r.x*U,6,r.y*U);b.scale.set(k,1,k);scn.add(a,b)})}
const km=keys.map(k=>{const m=new THREE.Mesh(new THREE.OctahedronGeometry(.28),new THREE.MeshBasicMaterial({color:0xe0a93b}));m.position.set(k.x*U,1,k.y*U);scn.add(m);return m});
const mc=document.createElement('canvas');mc.width=mc.height=256;face(mc.getContext('2d'),128,100,2.6,0);
const crm=[],pm={},mon=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(mc)}));scn.add(mon);
function render3d(p,t,dist){
  const bo=boss.on;scn.fog.color.setHex(bo?0x140303:0x030503);scn.background.setHex(bo?0x140303:0x030503);
  const sh=st=='play'?Math.max(0,1-dist/250)*.05:0;
  cam.position.set(p.x*U+(Math.random()-.5)*sh,(p.out?.4:1.6)+(walk?Math.sin(t/140)*.06:0),p.y*U+(Math.random()-.5)*sh);
  cam.rotation.set(p.out?0:pt,-p.a-Math.PI/2,p.out?.9:0);fl3.visible=!p.out;
  km.forEach((m,i)=>{m.visible=!keys[i].got;m.rotation.y=t/500});
  while(crm.length<crates.length){const m=new THREE.Mesh(new THREE.BoxGeometry(.5,.3,.25),new THREE.MeshBasicMaterial({color:0xe07b3b}));scn.add(m);crm.push(m)}
  crm.forEach((m,i)=>{const c=crates[i];m.visible=!!c;if(c)m.position.set(c.x*U,.2,c.y*U)});
  for(const id in P){if(id==me)continue;const q=P[id];let m=pm[id];
    if(!m){m=pm[id]=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(.22,.28,1.1,8),new THREE.MeshStandardMaterial({color:0x5a3a23,emissive:0x2a1608})),hd=new THREE.Mesh(new THREE.SphereGeometry(.17,8,8),new THREE.MeshStandardMaterial({color:0xd8b898,emissive:0x302418}));b.position.y=.55;hd.position.y=1.28;m.add(b,hd);scn.add(m)}
    m.position.set(q.x*U,q.out?.15:0,q.y*U);m.rotation.set(0,-(q.a||0)-Math.PI/2,q.out?1.5:0)}
  for(const id in pm)if(!P[id]){scn.remove(pm[id]);delete pm[id]}
  const ms=bo?3.2+(boss.ph||1)*.7:2.6;mon.scale.set(ms,ms,1);mon.position.set(M.x*U,ms/2+Math.sin(t/300)*.08,M.y*U);
  R.render(scn,cam)}

// ---------- menu flow: solo, lobby, intro cutscene ----------
function soloGame(){host=true;me='h';addP('h');st='intro';introT=0;$('m1').style.display='none';last=performance.now();requestAnimationFrame(loop)}
function startGame(){if(st=='lobby'){st='intro';introT=0}}
const ic=$('ic'),ix=ic.getContext('2d');
ic.onclick=()=>{skipI=true;if(host&&conns.length==0&&st=='intro')st='play'};
function ui(){
  const m=st=='lobby',i=st=='intro'&&!skipI;if(st!='intro')skipI=false;
  if(m!=um){um=m;$('menu').style.display=m?'flex':'none'}
  if(i!=uiS){uiS=i;ic.style.display=i?'block':'none'}
  if(m){$('lbn').textContent='اللاعبون: '+Object.keys(P).length+' / '+want+(host?'':' — بانتظار المضيف…');$('lbh').style.display=host?'':'none'}
}
const CAP=[
[0,'','مستودع مهجور… لا أحد يعلم ما جرى فيه.'],
[3,'د. رائد','الحالة الأخيرة لم تنجُ. غطّوها مع البقية.'],
[6.5,'المساعدة','دكتور… إنه يهمس من القفص مجددًا. يقول أسماءهم.'],
[10,'د. رائد','لا تسمّوه إنسانًا. كان «رقم ١٣»… وصار أنجح تجاربنا.'],
[13,'الكيان','أرجوكم… أريد أن أعود… كان لي وجه.'],
[16,'د. رائد','الإدارة تريده الليلة. حمّلوه على الشاحنة.'],
[19,'المساعدة','والمستودع؟'],
[20.3,'د. رائد','سنحرقه. لا شهود… ولا جثث.'],
[22,'د. رائد','أغلقوا الباب، وإن صرخ فلا تردّوا عليه.'],
[24,'','بعد ساعة… على طريق الغابة.'],
[25,'السائق','الحمولة هادئة جدًا… هذا لا يريحني.'],
[27,'زميله','قالوا: لا تفتحوا الصندوق مهما سمعتم.'],
[29,'','ثم بدأ الصندوق يهتز…'],
[30.2,'السائق','الصندوق ينفتح! تمسّكوا!'],
[31.4,'','وانقلبت الشاحنة في الغابة.'],
[33.5,'','الكيان تحرر… وهو الآن يريد قتلنا.'],

function cage(x,cx,by,cw,ch,s,r){
  x.save();x.translate((Math.random()-.5)*r,(Math.random()-.5)*r);
  face(x,cx,by-ch*.62,ch/125,s);
  x.strokeStyle='#4a4d52';x.lineWidth=Math.max(2,cw*.02);
  for(let i=0;i<=7;i++){const b=cx-cw/2+cw*i/7;x.beginPath();x.moveTo(b,by-ch);x.lineTo(b,by);x.stroke()}
  x.strokeRect(cx-cw/2,by-ch,cw,ch);x.restore()}
const sci=(x,p,y,k)=>{x.fillStyle='#8f9591';x.fillRect(p-k*.13,y-k*.62,k*.26,k*.62);x.fillStyle='#4a1410';x.fillRect(p-k*.05,y-k*.45,k*.1,k*.12);x.fillStyle='#c9ab8c';x.beginPath();x.arc(p,y-k*.72,k*.09,0,7);x.fill()};
function lab(x,w,h,s){ // abandoned warehouse: blood, covered bodies, scientists, caged monster
  x.fillStyle='#090a0c';x.fillRect(0,0,w,h);x.fillStyle='#14161a';x.fillRect(0,h*.68,w,h*.32);
  x.fillStyle='#0f1114';for(let i=0;i<5;i++)x.fillRect(w*.04+i*w*.22,0,w*.03,h*.68);
  const f=Math.sin(s*29)>.8?.4:1,L=x.createRadialGradient(w*.45,0,0,w*.45,0,h*.95);L.addColorStop(0,`rgba(255,225,150,${.3*f})`);L.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=L;x.fillRect(0,0,w,h);
  x.fillStyle='#ffe9a8';x.fillRect(w*.45-5,0,10,h*.03);
  x.fillStyle='#3d0a08';[[.15,.76,.06],[.42,.82,.09],[.66,.74,.05],[.3,.7,.04]].forEach(b=>{x.beginPath();x.ellipse(w*b[0],h*b[1],w*b[2],w*b[2]*.28,0,0,7);x.fill()});
  [[.1,.74],[.24,.79],[.38,.74]].forEach(b=>{const p=w*b[0],y=h*b[1];x.fillStyle='#8a867b';x.beginPath();x.ellipse(p,y,w*.07,h*.045,0,0,7);x.fill();x.beginPath();x.arc(p-w*.06,y-h*.012,h*.03,0,7);x.fill();x.fillStyle='#5c1410';x.beginPath();x.ellipse(p+w*.015,y,w*.02,h*.015,0,0,7);x.fill()});
  sci(x,w*.52,h*.8,h*.42);sci(x,w*.6,h*.8,h*.4);
  cage(x,w*.8,h*.78,w*.2,h*.5,s,s>13&&s<16?9:1.5)}
function dock(x,w,h,s){ // cage loaded onto the truck, warehouse burning behind
  x.fillStyle='#06080b';x.fillRect(0,0,w,h);x.fillStyle='#101317';x.fillRect(0,h*.72,w,h*.28);
  const a=s>20?Math.min(.45,(s-20)*.15)*(.8+Math.random()*.2):0,G=x.createRadialGradient(0,h*.6,0,0,h*.6,w*.7);G.addColorStop(0,`rgba(255,110,30,${a})`);G.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=G;x.fillRect(0,0,w,h);
  x.fillStyle='#2a3b2a';x.fillRect(w*.5,h*.2,w*.48,h*.52);x.fillStyle='#07090a';x.fillRect(w*.52,h*.24,w*.44,h*.46);
  x.fillStyle='#111';[.58,.9].forEach(c=>{x.beginPath();x.arc(w*c,h*.74,h*.06,0,7);x.fill()});x.fillStyle='#b3261e';x.fillRect(w*.5,h*.62,w*.015,h*.05);
  const q=clamp((s-16.6)/4.4,0,1);sci(x,w*.1,h*.8,h*.42);
  cage(x,w*(.18+.54*q),h*.68,w*.2,h*.4,s,q<1?3:1.5);
  x.fillStyle='#233023';x.fillRect(w*.52,h*.24,w*.44,h*.46*clamp((s-21.4)/.9,0,1))}
function introDraw(S){
  const w=ic.width=innerWidth,h=ic.height=innerHeight,x=ix;
  if(S<16)lab(x,w,h,S);else if(S<24)dock(x,w,h,S);else if(S<25){x.fillStyle='#030406';x.fillRect(0,0,w,h)}else road(S-25,w,h,x);
  const fa=Math.max(0,1-Math.abs(S-16)/.5,S>23&&S<24?S-23:0);if(fa>0){x.fillStyle=`rgba(0,0,0,${fa})`;x.fillRect(0,0,w,h)}
  let cp=null;for(const c of CAP)if(S>=c[0])cp=c;
  if(cp){const fs=Math.max(16,h*.045);x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,h*.83,w,h*.17);x.direction='rtl';x.textAlign='center';
    if(cp[1]){x.fillStyle='#e0a93b';x.font='700 '+fs*.85+'px "Noto Naskh Arabic",serif';x.fillText(cp[1]+':',w/2,h*.88)}
    x.fillStyle='#e8e0cf';x.font=fs+'px "Noto Naskh Arabic",serif';x.fillText(cp[2],w/2,h*.95)}
  x.fillStyle='rgba(232,224,207,.4)';x.font='14px sans-serif';x.textAlign='center';x.fillText('اضغط للتخطي',w/2,h*.06);
  const cue=(i,t,f)=>{if(S>t&&!ie[i]){ie[i]=1;f()}};
  cue(0,.2,()=>tone(45,6,'sawtooth',.15));
  cue(3,13,()=>{noise(.7,.9,500);tone(80,.5,'square',.4,35)});
  cue(4,22.2,()=>{thud(1);noise(.4,.8,1500)});
  cue(1,31.1,()=>{noise(1.2,1,900);tone(70,1,'square',.5,25)});
  cue(2,34,()=>{tone(900,1.2,'sawtooth',.4,250);noise(1,.6,5000)})}
function road(s,w,h,x){
  x.fillStyle='#030406';x.fillRect(0,0,w,h);
  x.fillStyle='#07100a';for(let i=0;i<8;i++){const tx=((i*w/6-s*(s<6.2?200:0))%(w*1.3)+w*1.3)%(w*1.3)-w*.15;x.fillRect(tx,h*.25,w*.04,h*.75)}
  x.fillStyle='#0a0a0c';x.fillRect(0,h*.7,w,h*.3);
  x.strokeStyle='rgba(150,170,190,.25)';for(let i=0;i<60;i++){const rx=(i*97+s*400)%w,ry=(i*53+s*900)%h;x.beginPath();x.moveTo(rx,ry);x.lineTo(rx-4,ry+16);x.stroke()}
  if(s<8){
    let bx=w*.25+Math.min(s,6)*w*.05,by=h*.6,rot=0,sh=0;
    if(s>4&&s<6.2)sh=(Math.random()-.5)*8;
    if(s>=6.2){const q=Math.min(1,(s-6.2)/1.2);rot=q*2.6;bx+=q*w*.12;by+=q*h*.1}
    x.save();x.translate(bx+sh,by+sh);x.rotate(rot);
    if(s<6.2){x.fillStyle='rgba(255,240,180,.12)';x.beginPath();x.moveTo(w*.32,h*.08);x.lineTo(w*.7,0);x.lineTo(w*.7,h*.2);x.fill()}
    x.fillStyle='#2a3b2a';x.fillRect(0,0,w*.32,h*.14);
    x.fillStyle='#e0c870';for(let i=0;i<5;i++)x.fillRect(w*.02+i*w*.055,h*.02,w*.04,h*.05);
    x.fillStyle='#111';x.beginPath();x.arc(w*.06,h*.14,h*.035,0,7);x.arc(w*.26,h*.14,h*.035,0,7);x.fill();x.restore()}
  if(s>4&&s<6.2&&Math.random()<.4){x.fillStyle='rgba(180,0,0,.25)';x.fillRect(0,0,w,h)}
  if(s>6.1&&s<6.5){x.fillStyle=`rgba(255,255,255,${1-(s-6.1)/.4})`;x.fillRect(0,0,w,h)}
  if(s>8){const a=Math.min(1,(s-8)/2.5);x.fillStyle=`rgba(0,0,0,${a})`;x.fillRect(0,0,w,h);face(x,w/2,h*.42,Math.min(w,h)/60*(.6+a*.9),s)}
}

function goLandscape(){initAudio(); // fullscreen + landscape lock (Android Chrome); other browsers fall back to the rotate message
  try{const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;
    if(f)Promise.resolve(f.call(e)).then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(x){}
}

function start(code){room=code;st='lobby';$('m1').style.display='none';$('lb').style.display='flex';$('lbc').textContent=code;last=performance.now();requestAnimationFrame(loop)}

function hostGame(){
  host=true;me='h';addP('h');
  const code=Math.random().toString(36).slice(2,6).toUpperCase();
  peer=new Peer('darkwoods-'+code);
  peer.on('open',()=>start(code));
  peer.on('error',e=>{if(e.type=='unavailable-id'){peer.destroy();hostGame()}else alert('خطأ في الاتصال: '+e.type)});
  peer.on('connection',c=>{
    conns.push(c);addP(c.peer);
    c.on('data',m=>{const q=P[c.peer];if(!q||q.out)return;if(m.t=='p'){q.x=m.x;q.y=m.y;q.a=m.a}else if(m.t=='f')shoot(c.peer,m.a)});
    c.on('close',()=>{delete P[c.peer];conns=conns.filter(k=>k!=c)});
  });
}

function joinGame(){
  const code=$('ci').value.trim().toUpperCase();if(!code)return;
  peer=new Peer();
  peer.on('open',id=>{
    me=id;const c=peer.connect('darkwoods-'+code);conns=[c];
    c.on('open',()=>start(code));
    c.on('data',m=>{
      if(m.t!='s')return;
      const o=P[me];P=m.P;if(o&&P[me]){P[me].x=o.x;P[me].y=o.y;P[me].a=o.a} // keep my own position
      M=m.M;st=m.st;crates=m.cr;boss=m.B;want=m.want;keys.forEach((k,i)=>k.got=m.k[i]);
    });
    c.on('close',()=>{alert('انقطع الاتصال بالغرفة');location.reload()});
  });
  peer.on('error',e=>alert('تعذر الانضمام. تأكد من الكود. ('+e.type+')'));
}

function sim(dt){ // host only
  if(st!='play')return;
  const alive=Object.values(P).filter(q=>!q.out);
  if(!alive.length){st='lose';return}
  const n=keys.filter(k=>k.got).length;let tg=null,bd=1e9;
  if(n==KEYS&&!boss.on){boss.on=true;boss.max=boss.hp=110*alive.length+50}
  alive.forEach(q=>{
    const h=Math.hypot(q.x-M.x,q.y-M.y);if(h<bd){bd=h;tg=q}
    keys.forEach(k=>{if(!k.got&&Math.hypot(q.x-k.x,q.y-k.y)<26)k.got=true});
    crates=crates.filter(c=>{if(Math.hypot(q.x-c.x,q.y-c.y)<22){q.am=Math.min(30,q.am+10);return false}return true});
    if(h<(boss.on?26:20))q.out=true});
  const ph=boss.hp>boss.max*.66?1:boss.hp>boss.max*.33?2:3;boss.ph=ph;
  let sp=boss.on?[0,95,125,150][ph]:75+n*14;
  if(stun>0){stun-=dt;sp*=.15}
  if(boss.on&&ph>1){boss.dash-=dt;if(boss.dash<=0){boss.dash=4;boss.dl=.6}if(boss.dl>0){boss.dl-=dt;sp*=3}}
  if(boss.on&&ph==3){boss.bl-=dt;if(boss.bl<=0){boss.bl=6;const a=Math.random()*6.28;M.x=clamp(tg.x+Math.cos(a)*170,20,W-20);M.y=clamp(tg.y+Math.sin(a)*170,20,W-20)}}
  bd=bd||1;M.x+=(tg.x-M.x)/bd*sp*dt;M.y+=(tg.y-M.y)/bd*sp*dt;
  if(boss.on&&boss.hp<=0)st='win';
  crT-=dt;if(crT<=0&&crates.length<6){crT=8;crates.push({x:150+Math.random()*1300,y:150+Math.random()*1300})}
}

function update(dt){
  const p=P[me];if(!p)return;
  let mv=false;
  if(st=='play'&&!p.out){
    const k=(...a)=>a.some(c=>kb[c]);
    let sx=joy.x+k('KeyD')-k('KeyA'),sf=-joy.y+k('KeyW','ArrowUp')-k('KeyS','ArrowDown');
    p.a+=(k('ArrowRight')-k('ArrowLeft'))*2*dt+lk;lk=0;
    const l=Math.hypot(sx,sf);if(l>1){sx/=l;sf/=l}
    if(l>.15)mv=true;
    const dx=Math.cos(p.a)*sf-Math.sin(p.a)*sx,dy=Math.sin(p.a)*sf+Math.cos(p.a)*sx;
    p.x=clamp(p.x+dx*130*dt,8,W-8);p.y=clamp(p.y+dy*130*dt,8,W-8);
    trees.forEach(t=>{const a=p.x-t.x,b=p.y-t.y,h=Math.hypot(a,b),m=t.r+8;if(h<m&&h>0){p.x=t.x+a/h*m;p.y=t.y+b/h*m}});
    fcd-=dt;if((fire||kb.Space)&&fcd<=0&&p.am>0){fcd=.35;flash=.08;shot();if(host)shoot(me,p.a);else if(conns[0]&&conns[0].open)conns[0].send({t:'f',a:p.a})}
  }
  walk=mv;if(mv){stepT-=dt;if(stepT<=0){stepT=.4;step()}}
  const dist=Math.hypot(p.x-M.x,p.y-M.y);
  mst-=dt;if(mst<=0&&dist<350&&st=='play'){mst=dist<150?.35:.6;thud(1-dist/350)}
  hb-=dt;if(hb<=0&&dist<400&&st=='play'){hb=.3+dist/400*.9;beat(1-dist/400)}
  cd-=dt;js-=dt;flash-=dt;
  if(st=='play'&&!p.out&&dist<100&&cd<=0){scare();cd=30}
  if(p.out&&!wasOut)scare();wasOut=p.out;
  if(boss.on&&!bs){bs=true;scare()}
  if(host&&st=='lobby'&&Object.keys(P).length>=want)startGame();if(host&&st=='intro'){introT+=dt;if(introT>38)st='play'}if(host)sim(dt);
  net+=dt;
  if(net>.066){net=0;
    if(host)conns.forEach(c=>c.open&&c.send({t:'s',P,M,k:keys.map(k=>k.got),st,cr:crates,B:boss,want}));
    else if(conns[0]&&conns[0].open)conns[0].send({t:'p',x:p.x,y:p.y,a:p.a});
  }
}

let ow=0,oh=0;
function draw(){
  const w=innerWidth,h=innerHeight;if(w!=ow||h!=oh){ow=cv.width=w;oh=cv.height=h;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
  const p=P[me]||{x:110,y:110,a:0,am:0},t=performance.now(),dist=Math.hypot(p.x-M.x,p.y-M.y);
  ui();if(st=='intro'&&!skipI){if(!it0){it0=t;ie=[]}introDraw((t-it0)/1000)}else if(st!='intro')it0=0;
  render3d(p,t,dist);
  g.clearRect(0,0,w,h);
  const vg=g.createRadialGradient(w/2,h/2,h*.3,w/2,h/2,h*.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.7)');g.fillStyle=vg;g.fillRect(0,0,w,h);
  if(dist<220&&st=='play'){g.fillStyle=`rgba(170,0,0,${(1-dist/220)*.45*(.6+.4*Math.sin(t/110))})`;g.fillRect(0,0,w,h)}
  if(flash>0){g.fillStyle='rgba(255,220,150,.12)';g.fillRect(0,0,w,h)}
  g.fillStyle='rgba(232,224,207,.6)';g.fillRect(w/2-1,h/2-1,2,2);
  if(tid!==null){g.strokeStyle='rgba(232,224,207,.35)';g.lineWidth=2;g.beginPath();g.arc(jo.x,jo.y,50,0,7);g.stroke()}
  if(boss.on&&st=='play'){g.fillStyle='#2a0707';g.fillRect(w/2-130,h-22,260,10);g.fillStyle='#c4160e';g.fillRect(w/2-130,h-22,260*Math.max(0,boss.hp/boss.max),10)}
  // minimap
  const m=$('mm').getContext('2d'),S=120,cx=mz==1?W/2:p.x,cy=mz==1?W/2:p.y,sc=S/(W/mz),mp=(x,y)=>[(x-cx)*sc+S/2,(y-cy)*sc+S/2];
  m.clearRect(0,0,S,S);m.fillStyle='rgba(5,10,6,.85)';m.fillRect(0,0,S,S);m.fillStyle='#14281a';
  trees.forEach(r=>{const[x,y]=mp(r.x,r.y);m.fillRect(x-1,y-1,2,2)});
  const dot=(o,c,r)=>{const[x,y]=mp(o.x,o.y);m.fillStyle=c;m.beginPath();m.arc(x,y,r,0,7);m.fill()};
  keys.forEach(k=>{if(!k.got)dot(k,'#e0a93b',2.5)});crates.forEach(c=>dot(c,'#e07b3b',2.5));
  for(const id in P)if(!P[id].out)dot(P[id],id==me?'#9fd3ff':'#f0a868',3);
  if(dist<350||boss.on)dot(M,'#ff2a1a',4);
  const n=keys.filter(k=>k.got).length;
  let msg=st=='win'?'🎉 هزمتم الوحش! (اضغط للإعادة)':st=='lose'?'💀 أمسك بكم الوحش (اضغط للإعادة)':p.out?'أمسك بك الوحش… شاهد فريقك':boss.on?`المرحلة ${boss.ph||1}/3 — التقطوا 🔫 وأطلقوا على الوحش!`:'';
  $('hud').innerHTML=`${room?'الغرفة: <b>'+room+'</b> &nbsp; ':''}🔑 ${n}/${KEYS} &nbsp; 👥 ${Object.keys(P).length} &nbsp; 🔫 ${p.am|0}<br>${msg}`;
  if(js>0){g.fillStyle=`rgba(${js>.5?'120,0,0':'0,0,0'},1)`;g.fillRect(0,0,w,h);face(g,w/2+(Math.random()-.5)*14,h*.42,Math.min(w,h)/38*(1.2-js*.3),t/1000)}
}

function loop(t){const dt=Math.min((t-last)/1000,.05);last=t;update(dt);draw();requestAnimationFrame(loop)}

// controls: left half = walk joystick, right half = look around
let tid=null,jo={x:0,y:0},lid=null,lx=0,ly=0;
cv.addEventListener('touchstart',e=>{for(const t of e.changedTouches){if(t.clientX<innerWidth/2){if(tid===null){tid=t.identifier;jo={x:t.clientX,y:t.clientY}}}else if(lid===null){lid=t.identifier;lx=t.clientX;ly=t.clientY}}});
cv.addEventListener('touchmove',e=>{for(const t of e.changedTouches){if(t.identifier===tid){joy.x=clamp((t.clientX-jo.x)/50,-1,1);joy.y=clamp((t.clientY-jo.y)/50,-1,1)}else if(t.identifier===lid){lk+=(t.clientX-lx)*.006;pt=clamp(pt-(t.clientY-ly)*.005,-1.1,1.1);lx=t.clientX;ly=t.clientY}}});
const end=e=>{for(const t of e.changedTouches){if(t.identifier===tid){tid=null;joy.x=joy.y=0}if(t.identifier===lid)lid=null}};
cv.addEventListener('touchend',end);cv.addEventListener('touchcancel',end);
cv.addEventListener('click',()=>{if(st!='play')location.reload()});
cv.addEventListener('mousemove',e=>{if(e.buttons){lk+=e.movementX*.004;pt=clamp(pt-e.movementY*.004,-1.1,1.1)}});
addEventListener('keydown',e=>kb[e.code]=true);addEventListener('keyup',e=>kb[e.code]=false);
</script>
